[package]
name = "trimontina"
version = "0.2.0"
edition = "2024"

[dependencies]
# Window + immediate-mode UI + OpenGL context in one crate.
# The `glow` renderer is required: libmpv's render API is initialized with
# OpenGL function pointers resolved from this very context.
eframe = { version = "0.34.1", features = ["glow"] }
# libmpv used as a decoding library (render API), not as an external player.
libmpv2 = "6.0.0"
thiserror = "2.0"
# Native file dialogs.
rfd = "0.15"
